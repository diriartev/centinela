[defaults]
inventory          = inventory.ini
roles_path         = ./roles
host_key_checking  = True
retry_files_enabled = False
stdout_callback    = default
result_format      = yaml
callbacks_enabled  = ansible.posix.profile_tasks
interpreter_python = auto_silent
timeout            = 30
deprecation_warnings = False
force_handlers     = True
# Contraseña de sudo en un archivo local (chmod 600), nunca en el repo
become_password_file = secretos/become_pass

[privilege_escalation]
become        = True
become_method = sudo

[ssh_connection]
pipelining = True
# -F /dev/null: ignora ~/.ssh/config (ControlMaster global) y usa solo esto
ssh_args   = -F /dev/null -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes
