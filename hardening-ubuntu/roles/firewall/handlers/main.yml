---
- name: Recargar ufw
  ansible.builtin.command: ufw reload
  changed_when: true

- name: Reiniciar knockd
  ansible.builtin.systemd:
    name: knockd
    state: restarted

- name: Validar configuración de Fail2Ban
  ansible.builtin.command: fail2ban-client -t
  changed_when: false
  listen: Reiniciar fail2ban

- name: Reiniciar servicio fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  listen: Reiniciar fail2ban
