<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>phpMyAdmin</title>
<style>body{background:#fff;font-family:sans-serif;font-size:13px}.c{width:380px;margin:60px auto}h1{text-align:center;font-weight:normal;color:#444}fieldset{border:1px solid #aaa;padding:16px;background:#f7f7f7}label{display:inline-block;width:110px}input,select{margin:4px 0}.e{color:#c00;margin:8px 0}.e:empty{display:none}</style></head>
<body><div class="c"><h1>Welcome to phpMyAdmin</h1><div class="e">{{error}}</div><form method="post" action="/phpmyadmin/index.php"><fieldset><legend>Log in</legend>
<label>Username:</label><input type="text" name="pma_username"><br><label>Password:</label><input type="password" name="pma_password"><br>
<label>Server Choice:</label><select name="server"><option>db-01.__SLUG__.internal</option></select></fieldset><p style="text-align:right"><input type="submit" value="Go"></p></form></div></body></html>
