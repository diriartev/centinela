<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área de clientes · __MARCA__</title><style>:root{--fondo:#F6F8FB;--tinta:#0F172A;--suave:#5B6474;--marca:#2563EB;--borde:#E2E8F0}*{box-sizing:border-box}body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}a{color:var(--marca);text-decoration:none}.cont{max-width:1080px;margin:0 auto;padding:0 20px}header.top{background:#fff;border-bottom:1px solid var(--borde)}header.top .cont{display:flex;align-items:center;justify-content:space-between;height:64px}.logo{font-weight:800;font-size:19px;color:var(--tinta)}.logo b{color:var(--marca)}nav a{margin-left:22px;color:var(--suave);font-size:15px}.boton{display:inline-block;padding:10px 18px;border-radius:8px;background:var(--marca);color:#fff!important;font-weight:600}.panel{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:28px}.centro{min-height:100vh;display:grid;place-items:center;padding:20px}.caja{width:min(100%,400px)}label{display:block;font-size:14px;color:var(--suave);margin:14px 0 6px}input{width:100%;height:44px;padding:0 12px;border:1px solid var(--borde);border-radius:8px;font-size:15px}button{width:100%;margin-top:18px;height:46px;border:0;border-radius:8px;background:var(--marca);color:#fff;font-weight:600;font-size:15px;cursor:pointer}.error{margin-top:12px;color:#B91C1C;font-size:14px}.error:empty{display:none}.nota{margin-top:14px;font-size:13px;color:var(--suave);text-align:center}footer{padding:28px 0;color:var(--suave);font-size:14px;border-top:1px solid var(--borde);margin-top:40px}@media(max-width:720px){nav{display:none}}</style></head><body>
<div class="centro"><form class="panel caja" method="post" action="/portal/login" autocomplete="on">
<a class="logo" href="/"><b>■</b> __MARCA__</a><h2 style="margin:16px 0 4px">Área de clientes</h2><p style="color:var(--suave);margin:0">Consulta tus servicios, facturas y solicitudes.</p>
<label for="u">Correo</label><input id="u" name="username" type="text" required>
<label for="p">Contraseña</label><input id="p" name="password" type="password" required>
<button type="submit">Ingresar</button><div class="error">{{error}}</div>
<div class="nota">¿Problemas para ingresar? Escribe a soporte@__DOMINIO__</div></form></div>
<!-- pendiente: retirar usuario de pruebas antes de pasar a producción: pruebas@__DOMINIO__ / __HT:qa-portal-password__ -->
</body></html>
