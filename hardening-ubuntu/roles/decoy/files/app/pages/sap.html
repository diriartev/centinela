<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAP NetWeaver Portal</title>
<style>body{margin:0;background:#edf0f3;font-family:Arial,Helvetica,sans-serif}.t{background:#354a5f;color:#fff;padding:14px 22px;font-size:16px}.b{width:min(92%,360px);margin:8vh auto;background:#fff;padding:26px;box-shadow:0 1px 4px rgba(0,0,0,.15)}label{display:block;margin:12px 0 4px;font-size:13px}input,select{width:100%;box-sizing:border-box;height:32px;border:1px solid #89919a;padding:0 6px}button{margin-top:18px;height:34px;padding:0 22px;border:0;background:#0a6ed1;color:#fff}.e{color:#b00;margin-top:10px;font-size:13px}.e:empty{display:none}</style></head>
<body><div class="t">SAP NetWeaver Portal · __MARCA__</div><form class="b" method="post" action="/irj/portal" autocomplete="off">
<label for="j_username">User *</label><input id="j_username" name="j_username" autofocus><label for="j_password">Password *</label><input id="j_password" name="j_password" type="password">
<label for="lang">Logon Language</label><select id="lang" name="ume.logon.locale"><option value="en">English</option><option value="es">Español</option></select>
<button type="submit">Log On</button><div class="e">{{error}}</div></form></body></html>
