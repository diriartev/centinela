<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetScaler Gateway</title>
<style>body{margin:0;background:#1f2a37;font-family:Arial,Helvetica,sans-serif;color:#222}.b{width:min(92%,380px);margin:9vh auto;background:#fff;padding:28px;border-radius:4px}h1{font-size:20px;margin:0 0 4px}small{color:#666}label{display:block;margin:14px 0 4px;font-size:13px}input[type=text],input[type=password]{width:100%;box-sizing:border-box;height:36px;padding:0 8px;border:1px solid #bbb}button{margin-top:18px;width:100%;height:38px;border:0;background:#0f6cbd;color:#fff;font-weight:bold}.e{color:#b00;margin-top:10px;font-size:13px}.e:empty{display:none}</style></head>
<body><form class="b" method="post" action="/cgi/login" autocomplete="off"><h1>NetScaler Gateway</h1><small>__MARCA__ · acceso remoto</small>
<label for="login">User name</label><input type="text" id="login" name="login" autofocus><label for="passwd">Password</label><input type="password" id="passwd" name="passwd">
<label for="passwd1">Passcode</label><input type="text" id="passwd1" name="passwd1" inputmode="numeric"><button type="submit">Log On</button><div class="e">{{error}}</div></form></body></html>
