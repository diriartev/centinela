---
# Web señuelo + gateway de sensores web (T-Pot) publicados por Cloudflare.
# Red "dmz": solo la ve cloudflared. Cada sensor: red propia con el gateway, sin salida.
- name: Decoy | Mapa de subdominios → sensores (para el gateway)
  ansible.builtin.set_fact:
    sensores_mapa: "{{ sensores_mapa_calc | from_yaml }}"
    trampas_cve: "{{ trampas_cve_calc | from_yaml }}"
  vars:
    sensores_mapa_calc: |
      {% for s in sensores_web if s.host %}
      "{{ s.host }}.{{ cf_dominio }}": { nombre: "{{ s.nombre }}", url: "{{ s.esquema }}://{{ s.ip }}:{{ s.puerto }}" }
      {% endfor %}
    trampas_cve_calc: |
      {% for s in sensores_web if not s.host %}
      { nombre: "{{ s.nombre }}", url: "{{ s.esquema }}://{{ s.ip }}:{{ s.puerto }}" }
      {% endfor %}

- name: Decoy | Una red interna por sensor (solo sensor + gateway, sin salida)
  community.docker.docker_network:
    name: "sensor-{{ item.nombre }}"
    driver: bridge
    internal: true
    ipam_config: [{ subnet: "{{ item.subred }}", gateway: "{{ item.gw }}" }]
    driver_options:
      com.docker.network.bridge.name: "{{ item.puente }}"
  loop: "{{ sensores_web }}"
  loop_control:
    label: "{{ item.nombre }} {{ item.subred }}"

- name: Decoy | Directorios
  ansible.builtin.file:
    path: "{{ item.p }}"
    state: directory
    owner: "{{ item.o }}"
    group: "{{ item.o }}"
    mode: "{{ item.m }}"
  loop:
    - { p: /opt/stacks/decoy, o: 0, m: "0711" }
    - { p: /opt/stacks/decoy/build, o: 0, m: "0700" }
    - { p: /opt/stacks/decoy/log, o: "{{ dockremap_subid_inicio + 10001 }}", m: "0755" }
    - { p: /opt/stacks/decoy/log/muestras, o: "{{ dockremap_subid_inicio + 10001 }}", m: "0755" }
    - { p: /opt/stacks/decoy/sensores, o: 0, m: "0711" }
    - { p: /opt/stacks/decoy/sensores/wordpot, o: 0, m: "0755" }
    - { p: /opt/stacks/decoy/sensores/wordpot/log, o: "{{ dockremap_subid_inicio + 2000 }}", m: "0755" }
    - { p: /opt/stacks/decoy/sensores/honeyaml/log, o: "{{ dockremap_subid_inicio + 2000 }}", m: "0755" }
    - { p: /opt/stacks/decoy/sensores/citrixhoneypot/log, o: "{{ dockremap_subid_inicio + 2000 }}", m: "0755" }
    - { p: /opt/stacks/decoy/sensores/log4pot/log, o: "{{ dockremap_subid_inicio + 2000 }}", m: "0755" }
    - { p: /opt/stacks/decoy/sensores/log4pot/payloads, o: "{{ dockremap_subid_inicio + 2000 }}", m: "0755" }
    - { p: /opt/stacks/decoy/sensores/h0neytr4p/log, o: "{{ dockremap_subid_inicio + 2000 }}", m: "0755" }
    - { p: /opt/stacks/decoy/sensores/h0neytr4p/payloads, o: "{{ dockremap_subid_inicio + 2000 }}", m: "0755" }

- name: Decoy | Las muestras capturadas se borran a los 30 días
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/centinela-muestras.conf
    content: |
      # Muestras de malware capturadas por el señuelo y los sensores (también quedan en Telegram)
      e /opt/stacks/decoy/log/muestras - - - 30d
      e /opt/stacks/decoy/sensores/h0neytr4p/payloads - - - 30d
      e /opt/stacks/decoy/sensores/log4pot/payloads - - - 30d
    mode: "0644"

- name: Decoy | Honeytokens generados para esta instalación (nunca los del repositorio)
  ansible.builtin.assert:
    that: lookup('ansible.builtin.fileglob', role_path + '/files/app/honeytokens.json') | length > 0
    fail_msg: "Falta roles/decoy/files/app/honeytokens.json: ejecuta primero  python3 scripts/regenerar-honeytokens.py"
    quiet: true

- name: Decoy | Configuración de Wordpot (blog creíble)
  ansible.builtin.template:
    src: wordpot.conf.j2
    dest: /opt/stacks/decoy/sensores/wordpot/wordpot.conf
    owner: root
    group: root
    mode: "0644"
  register: decoy_wordpot

- name: Decoy | Código de la web señuelo / gateway
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /opt/stacks/decoy/build/
    owner: root
    group: root
    mode: preserve
  loop: [Dockerfile, app]
  register: decoy_src

- name: Decoy | compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/stacks/decoy/compose.yml
    owner: root
    group: root
    mode: "0600"
  register: decoy_compose

- name: Decoy | Construir y levantar
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/decoy
    state: present
    pull: missing
    build: "{{ 'always' if decoy_src.changed else 'policy' }}"
    recreate: "{{ 'always' if (decoy_src.changed or decoy_wordpot.changed) else 'auto' }}"
    wait: true
    wait_timeout: 180
