---
# cloudflared: único contenedor con salida a internet. Publica en Cloudflare los
# servicios de la red admin (y el SSH del host) sin abrir ni un puerto.
- name: Edge | Directorios
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0711"
  loop: [/opt/stacks/edge, /opt/stacks/edge/secrets]

# Con userns-remap el usuario del contenedor (65532) es en el host el
# {{ dockremap_subid_inicio }} + 65532: el token solo lo puede leer ese UID.
- name: Edge | Token del túnel (solo legible por el usuario de cloudflared)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/secretos/cloudflared_tunnel_token"
    dest: /opt/stacks/edge/secrets/tunnel_token
    owner: "{{ dockremap_subid_inicio + 65532 }}"
    group: "{{ dockremap_subid_inicio + 65532 }}"
    mode: "0400"
  no_log: true
  notify: Recrear cloudflared

- name: Edge | compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/stacks/edge/compose.yml
    owner: root
    group: root
    mode: "0600"
  notify: Recrear cloudflared

- name: Edge | Levantar cloudflared
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/edge
    state: present
    pull: missing
    wait: true
    wait_timeout: 120
