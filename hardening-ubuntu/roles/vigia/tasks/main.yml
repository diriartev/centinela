---
# Vigía de alertas → bot de Telegram (a través del Worker hooks.). Se despliega cuando existe la
# clave de firma secretos/relay_hmac_key (la crea scripts/configurar-bot-telegram.sh).
- name: Vigía | ¿Hay clave de firma para el relay?
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/secretos/relay_hmac_key"
  delegate_to: localhost
  become: false
  register: vigia_clave

- name: Vigía | Desplegar
  when: vigia_clave.stat.exists
  block:
    - name: Vigía | Directorios
      ansible.builtin.file:
        path: "{{ item.p }}"
        state: directory
        owner: "{{ item.o }}"
        group: "{{ item.o }}"
        mode: "{{ item.m }}"
      loop:
        - { p: /opt/stacks/vigia, o: 0, m: "0711" }
        - { p: /opt/stacks/vigia/build, o: 0, m: "0700" }
        - { p: /opt/stacks/vigia/secrets, o: 0, m: "0711" }
        - { p: /opt/stacks/vigia/estado, o: "{{ dockremap_subid_inicio + 10004 }}", m: "0700" }
        - { p: /opt/stacks/vigia/cuarentena, o: "{{ dockremap_subid_inicio + 10004 }}", m: "0700" }

    - name: Vigía | Clave de firma (solo la lee el usuario del vigía)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/secretos/relay_hmac_key"
        dest: /opt/stacks/vigia/secrets/relay_key
        owner: "{{ dockremap_subid_inicio + 10004 }}"
        group: "{{ dockremap_subid_inicio + 10004 }}"
        mode: "0400"
      no_log: true
      register: vigia_key

    - name: Vigía | Token que usa Alertmanager para entregarle alertas
      ansible.builtin.copy:
        dest: /opt/stacks/vigia/secrets/alertas_token
        content: "{{ alertas_token }}"
        owner: "{{ dockremap_subid_inicio + 10004 }}"
        group: "{{ dockremap_subid_inicio + 10004 }}"
        mode: "0400"
      no_log: true
      register: vigia_tok

    - name: Vigía | Código
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /opt/stacks/vigia/build/
        owner: root
        group: root
        mode: preserve
      loop: [Dockerfile, app]
      register: vigia_src

    - name: Vigía | Variables (secretos)
      ansible.builtin.copy:
        dest: /opt/stacks/vigia/.env
        content: "ES_PASSWORD={{ es_vigia_password }}\n"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Vigía | compose.yml
      ansible.builtin.template:
        src: compose.yml.j2
        dest: /opt/stacks/vigia/compose.yml
        owner: root
        group: root
        mode: "0600"

    - name: Vigía | Construir y levantar
      community.docker.docker_compose_v2:
        project_src: /opt/stacks/vigia
        state: present
        build: "{{ 'always' if vigia_src.changed else 'policy' }}"
        recreate: "{{ 'always' if (vigia_src.changed or vigia_key.changed or vigia_tok.changed) else 'auto' }}"
        wait: false
