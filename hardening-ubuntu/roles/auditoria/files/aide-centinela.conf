# Centinela · AIDE enfocado (Gestionado por Ansible)
# Vigila SOLO lo que un intruso tocaría para quedarse (binarios, configuración, arranque,
# llaves SSH, servicios, módulos del kernel, configuración de los stacks). Corre cada hora
# con /usr/local/sbin/centinela-integridad, que avisa al bot y a Grafana.
# (El AIDE diario de Debian quedó desactivado: revisaba 120 000 archivos con miles de falsos positivos.)
database_in=file:/var/lib/centinela/aide/aide.db.gz
database_out=file:/var/lib/centinela/aide/aide.db.new.gz
gzip_dbout=yes
report_url=stdout
report_summarize_changes=yes
report_grouped=yes
report_level=list_entries
report_ignore_e2fsattrs=EhI
log_level=error
warn_dead_symlinks=no

# Contenido: permisos, dueño, tipo, tamaño y hash (no inodo ni fechas: un archivo reescrito igual no es un cambio)
Contenido = p+u+g+ftype+s+sha256+l
Arranque  = p+u+g+ftype+s+sha256+l+i

/boot                               Arranque
/etc                                Contenido
/usr/bin                            Contenido
/usr/sbin                           Contenido
/usr/local                          Contenido
/usr/lib/systemd                    Contenido
/usr/lib/modules                    Contenido
/usr/lib/x86_64-linux-gnu/security  Contenido
/usr/lib/sudo                       Contenido
/usr/libexec                        Contenido
/root                               Contenido
/home                               Contenido
/var/spool/cron                     Contenido
/opt/stacks                         Contenido

# Cambian solos sin que sea un riesgo (o ya los vigila auditd en tiempo real)
!/etc/mtab$
!/etc/ufw/user6?\.rules$
!/etc/ufw/user6?\.rules\.[0-9]+$
!/etc/\.pwd\.lock$
!/etc/adjtime$
!/etc/ld\.so\.cache$
!/etc/apparmor\.d/cache
!/etc/fail2ban/.*\.sqlite3
!/etc/lvm/(archive|backup)
!/etc/cups
!/etc/machine-id$
!/(root|home/[^/]+)/\.(cache|ansible|local/share|lesshst|viminfo|wget-hsts|python_history|sudo_as_admin_successful|npm|docker/buildx)
!/(root|home/[^/]+)/\.[a-z]*_history$
!/(root|home/[^/]+)/snap
!/opt/stacks/[^/]+/(data|datos|log|logs|estado|status|cuarentena|snapshots|geoip|build)(/|$)
!/opt/stacks/decoy/sensores/[^/]+/(payloads|logs?|data)(/|$)
!/opt/stacks/monitoreo/grafana/datos(/|$)
